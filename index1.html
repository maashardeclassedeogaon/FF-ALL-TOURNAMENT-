<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Custom Tournament</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #d9381e;
        }
        .match-card {
            background: #fff3f0;
            border-left: 4px solid #d9381e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .match-card p {
            margin: 6px 0;
            font-size: 14px;
        }
        .qr-box {
            text-align: center;
            margin: 15px 0;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }
        .qr-box img {
            width: 160px;
            height: 160px;
            border-radius: 6px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Free Fire 1v1 Custom 🔥</h2>
    
    <div class="match-card">
        <p><strong>🎮 मोड:</strong> 1v1 Custom (Bermuda)</p>
        <p><strong>💰 एंट्री फीस:</strong> ₹20</p>
        <p><strong>🏆 प्राइज पूल:</strong> ₹35</p>
    </div>

    <div class="qr-box">
        <p style="margin-top: 0; font-size: 13px; color: #555;"><strong>स्कैन करके पेमेंट करें:</strong></p>
        <!-- यहाँ qr.png आपकी QR कोड वाली फोटो है -->
        <img src="qr.png" alt="UPI QR Code">
        <p style="font-size: 12px; color: #777; margin-bottom: 0;">UPI ID: <code>yourupi@paytm</code></p>
    </div>

    <form>
        <div class="form-group">
            <label>In-Apna Name:</label>
            <input type="text" placeholder="अपना Free Fire नाम लिखें" required>
        </div>
        
        <div class="form-group">
            <label>Free Fire UID:</label>
            <input type="text" placeholder="अपनी गेम UID यहाँ डालें" required>
        </div>
           <div class="form-group">
            <label>Free Fire Name :</label>
            <input type="text" placeholder="In-Game Name (गेम का नाम):" required>
        </div>


        <div class="form-group">
            <label>Transaction ID / UTR Number:</label>
            <input type="text" placeholder="पैमेंट का UTR नंबर यहाँ लिखें" required>
        </div>

        <button type="submit">Submit & Join Match</button>
    </form>
</div>

</body>
</html>
